name: Build and Push Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5 # Using the official action is easier for caching
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/etiennelabs:latest
            ghcr.io/${{ github.repository_owner }}/etiennelabs:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

        # - name: Build and Push Docker image
        # run: |
        #   docker buildx build \
        #     --platform linux/arm64 \
        #     --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
        #     -t ghcr.io/${{ github.repository_owner }}/etiennelabs:latest \
        #     -t ghcr.io/${{ github.repository_owner }}/etiennelabs:${{ github.sha }} \
        #     --push \
        #     .

      - name: Trigger Dokploy Deployment
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "Content-Type: application/json"
